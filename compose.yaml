services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cgp}
      POSTGRES_USER: ${POSTGRES_USER:-cgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgp_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-cgp}
      POSTGRES_USER: ${POSTGRES_USER:-cgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cgp_local}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
